name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example.dev .env.local

      - run: cp .env.example.prod .env.prod

      - run: pnpm exec prettier --check "**/*.{ts,tsx,json,md}"

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test:unit

  migrations:
    runs-on: ubuntu-latest
    services:
      # Throwaway database, discarded with the runner. Same major version as
      # docker/docker-compose.yml.
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: mintit
          POSTGRES_PASSWORD: mintit
          POSTGRES_DB: mintit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mintit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgres://mintit:mintit@localhost:5432/mintit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @mintit/types build

      - run: pnpm test:migrations
