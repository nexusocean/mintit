name: Release image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # keyless cosign signing

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/mintit-app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build locally first so it can be scanned before anything is pushed
      - name: Build for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: mint-app
          platforms: linux/amd64
          load: true
          tags: scan-target:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan
        # TODO: pin to the full commit SHA of this tag (tags were force-pushed in the Mar 2026 compromise)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: scan-target:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0' # report-only; set to '1' to block releases on findings

      # Log in only after the scan so third-party actions above never see the token
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: mint-app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
