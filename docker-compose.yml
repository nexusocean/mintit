name: mintit

services:
  mint_proxy:
    container_name: mint_proxy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    env_file:
      - .env
    depends_on:
      mint_app:
        condition: service_healthy
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    networks:
      - mint_net

  mint_app:
    container_name: mint_app
    build: .
    restart: unless-stopped
    expose:
      - 3000
    env_file:
      - .env
    depends_on:
      mint_db:
        condition: service_started
    volumes:
      # Wallet and JWT files.
      - ./data/app:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/v1/health/ready']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mint_net

  mint_db:
    container_name: mint_db
    image: postgres:18.4
    restart: unless-stopped
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - mint_net

networks:
  mint_net:
    driver: bridge
    name: mint_net
